<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Treino Hipertrofia</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1 id="title">Hoje</h1>
    <span id="subtitle"></span>
  </header>

  <main id="view"></main>

  <div id="timer" class="timer hidden">
    <div>
      <small>Descanso</small>
      <strong id="timer-value">0:00</strong>
    </div>
    <div class="timer-actions">
      <button data-action="timer-add">+15s</button>
      <button data-action="timer-stop">Pular</button>
    </div>
  </div>

  <nav class="tabbar">
    <button data-tab="hoje" class="active"><span>●</span>Hoje</button>
    <button data-tab="semana"><span>▦</span>Semana</button>
    <button data-tab="treinos"><span>☰</span>Treinos</button>
    <button data-tab="historico"><span>↻</span>Histórico</button>
  </nav>

  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <button class="modal-close" data-action="close-modal" aria-label="Fechar">×</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
